// The kinds of harm that section A.1.8's definition of an AI incident names.
enum GaiIncidentHarm {
  GAI_INCIDENT_HARM_UNSPECIFIED = 0;
  GAI_INCIDENT_HARM_INJURY_OR_HARM_TO_HEALTH = 1;
  GAI_INCIDENT_HARM_CRITICAL_INFRASTRUCTURE_DISRUPTION = 2;
  GAI_INCIDENT_HARM_RIGHTS_VIOLATIONS = 3;
  GAI_INCIDENT_HARM_HARM_TO_PROPERTY_COMMUNITIES_OR_ENVIRONMENT = 4;
}
// The lifecycle stages section 2 names for GAI. They differ from the seven stages of the AI RMF's Figure 3.
enum GaiLifecycleStage {
  GAI_LIFECYCLE_STAGE_UNSPECIFIED = 0;
  GAI_LIFECYCLE_STAGE_DESIGN = 1;
  GAI_LIFECYCLE_STAGE_DEVELOPMENT = 2;
  GAI_LIFECYCLE_STAGE_DEPLOYMENT = 3;
  GAI_LIFECYCLE_STAGE_OPERATION = 4;
  GAI_LIFECYCLE_STAGE_DECOMMISSIONING = 5;
}
// The techniques for provenance data tracking in section A.1.6.
enum GaiProvenanceTechnique {
  GAI_PROVENANCE_TECHNIQUE_UNSPECIFIED = 0;
  GAI_PROVENANCE_TECHNIQUE_DIGITAL_WATERMARKING = 1;
  GAI_PROVENANCE_TECHNIQUE_METADATA_RECORDING = 2;
  GAI_PROVENANCE_TECHNIQUE_DIGITAL_FINGERPRINTING = 3;
  GAI_PROVENANCE_TECHNIQUE_HUMAN_AUTHENTICATION = 4;
}
// The types of AI red-teaming in section A.1.5.
enum GaiRedTeamingType {
  GAI_RED_TEAMING_TYPE_UNSPECIFIED = 0;
  GAI_RED_TEAMING_TYPE_GENERAL_PUBLIC = 1;
  GAI_RED_TEAMING_TYPE_EXPERT = 2;
  GAI_RED_TEAMING_TYPE_COMBINATION = 3;
  GAI_RED_TEAMING_TYPE_HUMAN_AI = 4;
}
// The three groups into which footnote 5 says an organization could sort the risks, as one possible way.
enum GaiRiskGrouping {
  GAI_RISK_GROUPING_UNSPECIFIED = 0;
  GAI_RISK_GROUPING_TECHNICAL_OR_MODEL = 1;
  GAI_RISK_GROUPING_MISUSE_BY_HUMANS = 2;
  GAI_RISK_GROUPING_ECOSYSTEM_OR_SOCIETAL = 3;
}
// The 12 risks of section 2.
enum GaiRiskName {
  GAI_RISK_NAME_UNSPECIFIED = 0;
  GAI_RISK_NAME_CBRN_INFORMATION_OR_CAPABILITIES = 1;
  GAI_RISK_NAME_CONFABULATION = 2;
  GAI_RISK_NAME_DANGEROUS_VIOLENT_OR_HATEFUL_CONTENT = 3;
  GAI_RISK_NAME_DATA_PRIVACY = 4;
  GAI_RISK_NAME_ENVIRONMENTAL_IMPACTS = 5;
  GAI_RISK_NAME_HARMFUL_BIAS_OR_HOMOGENIZATION = 6;
  GAI_RISK_NAME_HUMAN_AI_CONFIGURATION = 7;
  GAI_RISK_NAME_INFORMATION_INTEGRITY = 8;
  GAI_RISK_NAME_INFORMATION_SECURITY = 9;
  GAI_RISK_NAME_INTELLECTUAL_PROPERTY = 10;
  GAI_RISK_NAME_OBSCENE_DEGRADING_OR_ABUSIVE_CONTENT = 11;
  GAI_RISK_NAME_VALUE_CHAIN_AND_COMPONENT_INTEGRATION = 12;
}
// The levels where section 2 says a risk may exist.
enum GaiRiskScope {
  GAI_RISK_SCOPE_UNSPECIFIED = 0;
  GAI_RISK_SCOPE_MODEL_OR_SYSTEM = 1;
  GAI_RISK_SCOPE_APPLICATION_OR_IMPLEMENTATION = 2;
  GAI_RISK_SCOPE_ECOSYSTEM = 3;
}
// Where section 2 says a risk may come from.
enum GaiRiskSource {
  GAI_RISK_SOURCE_UNSPECIFIED = 0;
  GAI_RISK_SOURCE_DESIGN = 1;
  GAI_RISK_SOURCE_TRAINING = 2;
  GAI_RISK_SOURCE_OPERATION = 3;
  GAI_RISK_SOURCE_INPUTS = 4;
  GAI_RISK_SOURCE_OUTPUTS = 5;
  GAI_RISK_SOURCE_HUMAN_BEHAVIOR = 6;
  GAI_RISK_SOURCE_HUMAN_AI_INTERACTION = 7;
}
// How section 2 says a risk may materialize over time.
enum GaiRiskTimeScale {
  GAI_RISK_TIME_SCALE_UNSPECIFIED = 0;
  GAI_RISK_TIME_SCALE_ABRUPT = 1;
  GAI_RISK_TIME_SCALE_EXTENDED = 2;
}
// The existing controls that section A.1.3 says can apply to third-party GAI.
enum GaiThirdPartyControl {
  GAI_THIRD_PARTY_CONTROL_UNSPECIFIED = 0;
  GAI_THIRD_PARTY_CONTROL_ACQUISITION_AND_PROCUREMENT_DUE_DILIGENCE = 1;
  GAI_THIRD_PARTY_CONTROL_SOFTWARE_BILLS_OF_MATERIALS = 2;
  GAI_THIRD_PARTY_CONTROL_SERVICE_LEVEL_AGREEMENTS = 3;
  GAI_THIRD_PARTY_CONTROL_SSAE_REPORTS = 4;
}
