classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/NamedThing
    description: 'Abstract base for identifiable elements of the GAI Profile.

      Inlined here to keep this schema standalone; mirrors the

      `NamedThing` defined in NIST AI 100-1.'
    in_subset:
    - gai_base
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    related_mappings:
    - nist_ai_100_1:NamedThing
    abstract: true
    slots:
    - id
    - title
    - description
    class_uri: nist_ai_600_1:NamedThing
  GaiRisk:
    name: GaiRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRisk
    description: 'A risk that is novel to or exacerbated by Generative AI.

      Each instance corresponds to one of the 12 risk categories

      enumerated in NIST AI 600-1 Section 2.'
    in_subset:
    - gai_core
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    close_mappings:
    - nist_ai_100_1:AiSpecificRisk
    related_mappings:
    - iso29100:PrivacyRisk
    broad_mappings:
    - iso27001:Risk
    is_a: NamedThing
    slots:
    - id
    - title
    - description
    - gai_risk_kind
    - risk_categorization
    - risk_scope
    - risk_sources
    - time_scale
    - lifecycle_stage
    - trustworthiness_characteristic
    - addressed_by_actions
    class_uri: nist_ai_600_1:GaiRisk
  SuggestedAction:
    name: SuggestedAction
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/SuggestedAction
    description: 'A suggested action an organisation can take to manage GAI

      risks. Each action is identified by an Action ID, linked to an

      AI RMF subcategory, and may be relevant to one or more GAI

      risks and AI actor tasks (NIST AI 600-1 Section 3).'
    in_subset:
    - gai_actions
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    close_mappings:
    - stix:CourseOfAction
    related_mappings:
    - oscal_catalog:Control
    - gist_linkml:Task
    is_a: NamedThing
    slots:
    - title
    - action_id
    - function_prefix
    - applies_to_subcategory
    - gai_risks
    - actor_task
    - SuggestedAction_id
    - SuggestedAction_description
    slot_usage:
      id:
        name: id
        description: 'Identifier for the action - typically the same as the

          `action_id` (e.g., "GV-1.1-001").'
      description:
        name: description
        description: The suggested-action text itself.
    class_uri: nist_ai_600_1:SuggestedAction
  PrimaryGaiConsideration:
    name: PrimaryGaiConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/PrimaryGaiConsideration
    description: "An overarching consideration derived from the NIST GAI PWG\nconsultation\
      \ process (Appendix A). The `consideration_kind`\nattribute discriminates between\
      \ the four primary\nconsiderations: Governance, Pre-Deployment Testing, Content\n\
      Provenance, and Incident Disclosure.\n\nAll consideration-specific attributes\
      \ are optional and apply\nto the appropriate `consideration_kind`:\n  * GOVERNANCE:\
      \ governance_practices, third_party_considerations\n  * PRE_DEPLOYMENT_TESTING:\
      \ limitations_of_current_approaches\n  * CONTENT_PROVENANCE: provenance_techniques\n\
      \  * INCIDENT_DISCLOSURE: ai_incident_definition"
    in_subset:
    - gai_considerations
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    related_mappings:
    - nist_csf:CSFProperty
    is_a: NamedThing
    slots:
    - id
    - title
    - description
    - consideration_kind
    - governance_practices
    - third_party_considerations
    - limitations_of_current_approaches
    - provenance_techniques
    - ai_incident_definition
    class_uri: nist_ai_600_1:PrimaryGaiConsideration
  StructuredPublicFeedback:
    name: StructuredPublicFeedback
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/StructuredPublicFeedback
    description: 'Methods used to evaluate whether GAI systems are performing as

      intended and to calibrate and verify traditional measurement

      methods (A.1.5).'
    in_subset:
    - gai_feedback
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    related_mappings:
    - iso27001:InterestedParty
    is_a: NamedThing
    slots:
    - id
    - title
    - description
    - feedback_method_kind
    class_uri: nist_ai_600_1:StructuredPublicFeedback
  AiRedTeaming:
    name: AiRedTeaming
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/AiRedTeaming
    description: 'A structured testing exercise used to probe an AI system to

      find flaws and vulnerabilities such as inaccurate, harmful, or

      discriminatory outputs, often in a controlled environment and

      in collaboration with system developers (A.1.5).'
    in_subset:
    - gai_feedback
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    related_mappings:
    - stix:AttackPattern
    is_a: StructuredPublicFeedback
    slots:
    - id
    - title
    - description
    - red_team_type
    - AiRedTeaming_feedback_method_kind
    slot_usage:
      feedback_method_kind:
        name: feedback_method_kind
        ifabsent: StructuredFeedbackMethodEnum(AI_RED_TEAMING)
    class_uri: nist_ai_600_1:AiRedTeaming
  GaiProfile:
    name: GaiProfile
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiProfile
    description: 'Root container that bundles the NIST AI 600-1 Generative AI

      Profile: GAI risks (Section 2), suggested actions (Section 3),

      and primary considerations (Appendix A). The GAI Profile is a

      *cross-sectoral* AI RMF profile (Section 1).'
    in_subset:
    - gai_core
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    exact_mappings:
    - oscal_profile:Profile
    close_mappings:
    - nist_csf:CSFDocument
    related_mappings:
    - nist_ai_100_1:AiRmfProfile
    is_a: NamedThing
    slots:
    - id
    - title
    - description
    - gai_risk_catalog
    - suggested_actions
    - primary_considerations
    - structured_feedback_methods
    class_uri: nist_ai_600_1:GaiProfile
    tree_root: true
