types:
  GaiActionId:
    name: GaiActionId
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiActionId
    description: 'Action identifier used in NIST AI 600-1 Section 3, of the form

      "<prefix>-<category>.<subcategory>-<seq>" - e.g., "GV-1.1-001".

      Prefixes: GV (Govern), MP (Map), MS (Measure), MG (Manage).'
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|MP|MS|MG)-[0-9]+\.[0-9]+-[0-9]{3}$
  SubcategoryCode:
    name: SubcategoryCode
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/SubcategoryCode
    description: 'Identifier for an AI RMF Core subcategory referenced by a

      suggested action (e.g., "GOVERN 1.1"). Mirrors the

      `SubcategoryCode` type defined by NIST AI 100-1.'
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    exact_mappings:
    - nist_ai_100_1:SubcategoryCode
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN|MAP|MEASURE|MANAGE) [0-9]+\.[0-9]+$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
