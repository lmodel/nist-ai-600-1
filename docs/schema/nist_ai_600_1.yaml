name: nist_ai_600_1
annotations:
  publication_date:
    tag: publication_date
    value: 2024-07
  publication_approved:
    tag: publication_approved
    value: '2024-07-25'
description: 'A LinkML model of NIST AI 600-1, the Generative Artificial Intelligence
  Profile of the AI Risk Management Framework: its 12 risks, the suggested actions
  its tables list under AI RMF subcategories, and its four primary considerations.'
title: NIST AI RMF Generative AI Profile (NIST AI 600-1)
comments:
- The publication has no version number of its own, so the version is the 1.0.0 of
  the AI RMF it profiles, and source is the publication's digital object identifier.
  The release tags are the schema's own versions, and scripts/check_upstream_release.py
  reports when NIST changes the file.
- It imports the base and profiles modules of lmodel/nist-ai-100-1, vendored under
  nist_ai_100_1/, so it needs no network. tests/test_schema_rules.py holds them to
  their hashes.
- The publication is a work of the United States Government. NOTICE says what it allows.
  The schema's descriptions are this project's own words; NIST's text is in src/nist_ai_600_1/data/.
source: https://doi.org/10.6028/NIST.AI.600-1
see_also:
- https://lmodel.github.io/nist-ai-600-1
- https://airc.nist.gov/Home
- https://doi.org/10.6028/NIST.AI.100-1
id: https://w3id.org/lmodel/nist-ai-600-1
version: 1.0.0
imports:
- linkml:types
- ./nist_ai_100_1/nist_ai_100_1_base
- ./nist_ai_100_1/nist_ai_100_1_profiles
- ./nist_ai_600_1_risks
- ./nist_ai_600_1_actions
- ./nist_ai_600_1_considerations
- nist_ai_100_1/nist_ai_100_1_base
