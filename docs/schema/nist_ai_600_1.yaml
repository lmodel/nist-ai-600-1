name: nist-ai-600-1
description: "LinkML schema for NIST AI 600-1, the Generative Artificial Intelligence\n\
  Profile of the AI Risk Management Framework (July 2024).\n\nThis is a **cross-sectoral\
  \ profile** and a *companion resource* to\nNIST AI 100-1 (AI RMF 1.0). It defines\
  \ risks that are novel to or\nexacerbated by the use of Generative AI (GAI) and\
  \ provides a set of\nsuggested actions, organised by AI RMF subcategory, that\n\
  organisations can take to govern, map, measure, and manage those\nrisks.\n\nThis\
  \ schema is **standalone** - it inlines the minimal AI RMF\nbase scaffolding (`NamedThing`,\
  \ lifecycle / trustworthiness /\nactor-task enums, `SubcategoryCode` type) needed\
  \ to express the\nGAI Profile so it has no schema-level dependency on the sibling\n\
  `nist-ai-rmf` schema. Cross-references to AI RMF 1.0 elements\nare recorded as `*_mappings`\
  \ for traceability.\n\nThe schema covers:\n  * 12 GAI risk categories (Section 2)\n\
  \  * Risk dimensions (lifecycle stage, scope, source, time scale)\n  * `SuggestedAction`\
  \ entries (Section 3 tables) linked to AI RMF\n    subcategories\n  * Primary GAI\
  \ Considerations (Appendix A): Governance,\n    Pre-Deployment Testing, Content\
  \ Provenance, Incident Disclosure\n  * Structured Public Feedback methods and AI\
  \ Red-teaming types"
title: NIST AI RMF Generative AI Profile (NIST AI 600-1)
source: https://doi.org/10.6028/NIST.AI.600-1
see_also:
- https://doi.org/10.6028/NIST.AI.600-1
- https://airc.nist.gov/Home
- https://doi.org/10.6028/NIST.AI.100-1
