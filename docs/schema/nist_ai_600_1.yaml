    base: str
    uri: xsd:string
    repr: str
  ai_rmf_function_identifier:
    name: ai_rmf_function_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfFunctionIdentifier
    description: The name of one of the four Core functions, written in capitals,
      such as GOVERN.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN|MAP|MEASURE|MANAGE)$
  ai_rmf_category_identifier:
    name: ai_rmf_category_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfCategoryIdentifier
    description: A category's identifier, its function's name and a number, such as
      GOVERN 1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])$
  ai_rmf_subcategory_identifier:
    name: ai_rmf_subcategory_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSubcategoryIdentifier
    description: A subcategory's identifier, its category's identifier, a dot and
      a number, such as GOVERN 1.1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])\.[1-9][0-9]?$
  gai_action_identifier:
    name: gai_action_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiActionIdentifier
    description: 'An Action ID: the function''s two letters, its subcategory''s numbers
      and a three-digit number, such as GV-1.1-001 for the first action of GOVERN
      1.1.'
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_actions
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV-[1-6]|MP-[1-5]|MS-[1-4]|MG-[1-4])\.[1-9][0-9]?-[0-9]{3}$
enums:
  AiRmfCharacteristicName:
    name: AiRmfCharacteristicName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfCharacteristicName
    description: The seven characteristics of trustworthy AI systems in section 3
      of the publication.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    permissible_values:
      valid_and_reliable:
        text: valid_and_reliable
        description: Shown by evidence to meet the needs of its intended use, and
          works without failure over time. Figure 4 makes it a necessary condition
          for the others.
        title: Valid and Reliable
      safe:
        text: safe
        description: Keeps people, property and the environment out of danger under
          defined conditions.
        title: Safe
      secure_and_resilient:
        text: secure_and_resilient
        description: Withstands adverse events and recovers from them, and keeps confidentiality,
          integrity and availability through protections against attack.
        title: Secure and Resilient
      accountable_and_transparent:
        text: accountable_and_transparent
        description: Answerable for outcomes, which rests on people being able to
          get information about the system and its outputs. Figure 4 shows it relating
          to all the others.
        title: Accountable and Transparent
      explainable_and_interpretable:
        text: explainable_and_interpretable
        description: Its working can be represented (how a decision was made) and
          its output understood in context (why, and what it means for the user).
        title: Explainable and Interpretable
      privacy_enhanced:
        text: privacy_enhanced
        description: Guided by the norms and practices that protect human autonomy,
          identity and dignity, such as anonymity, confidentiality and control.
        title: Privacy-Enhanced
      fair_with_harmful_bias_managed:
        text: fair_with_harmful_bias_managed
        description: Addresses equality and equity, including harmful bias and discrimination,
          knowing that views of fairness differ across cultures and applications.
        title: "Fair \u2013 with Harmful Bias Managed"
  AiRmfActorTaskName:
    name: AiRmfActorTaskName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfActorTaskName
    description: The ten AI actor tasks and five additional AI actors of Appendix
      A.
    comments:
    - 'One list holds both kinds because NIST tags them together: the Playbook under
      its AI Actors key, and AI 600-1 under AI Actor Tasks. Each alias is the spelling
      those tags use where it differs from the title in Appendix A.'
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    permissible_values:
      ai_design:
        text: ai_design
        description: Setting what the system is for, planning and designing it, and
          gathering and preparing its data.
        title: AI Design
      ai_development:
        text: ai_development
        description: Providing the initial infrastructure, and creating, selecting,
          calibrating, training and testing models.
        title: AI Development
      ai_deployment:
        text: ai_deployment
        description: Deciding how the system is used and putting it into production,
          including pilots and compliance checks.
        title: AI Deployment
      operation_and_monitoring:
        text: operation_and_monitoring
        description: Running the system and regularly assessing its output and impacts.
        title: Operation and Monitoring
      tevv:
        text: tevv
        description: Examining the system or its components and finding and fixing
          problems, throughout the lifecycle.
        title: Test, Evaluation, Verification, and Validation (TEVV)
        aliases:
        - TEVV
      human_factors:
        text: human_factors
        description: Human-centered design and evaluation, involving end users and
          bringing context-specific norms and values into design.
        title: Human Factors
      domain_expert:
        text: domain_expert
        description: Giving knowledge of the sector or setting where the system is
          used.
        title: Domain Expert
        aliases:
        - Domain Experts
      ai_impact_assessment:
        text: ai_impact_assessment
        description: Assessing accountability, harmful bias, impacts, product safety,
          liability and security.
        title: AI Impact Assessment
      procurement:
        text: procurement
        description: Buying AI from another party, under financial, legal or policy
          authority.
        title: Procurement
      governance_and_oversight:
        text: governance_and_oversight
        description: Holding management, fiduciary and legal authority for the organization
          where the system is designed, developed or deployed.
        title: Governance and Oversight
      third_party_entities:
        text: third_party_entities
        description: Outside organizations that supply or evaluate the data, models,
          systems or services an organization acquires.
        title: Third-party entities
      end_users:
        text: end_users
        description: The people or groups who use the system, whether new to technology
          or expert in AI.
        title: End users
        aliases:
        - End-Users
        - End Users
      affected_individuals_and_communities:
        text: affected_individuals_and_communities
        description: Those directly or indirectly affected by the system or its output,
          whether or not they interact with it.
        title: Affected individuals/communities
        aliases:
        - Affected Individuals and Communities
      other_ai_actors:
        text: other_ai_actors
        description: Those who set norms or guidance on AI risk, such as standards
          bodies, advocacy groups and researchers.
        title: Other AI actors
      general_public:
        text: general_public
        description: Those most likely to experience the impacts directly, who may
          motivate what other AI actors do.
        title: General public
  AiRmfProfileKind:
    name: AiRmfProfileKind
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfProfileKind
    description: The kinds of AI RMF profile that section 6 names.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_profiles
    permissible_values:
      use_case:
        text: use_case
        description: The Core implemented for a specific setting or application.
        title: Use-case profile
      current:
        text: current
        description: A temporal profile saying how AI is managed today and the related
          risks, in terms of current outcomes.
        title: Current Profile
      target:
        text: target
        description: A temporal profile saying which outcomes the desired risk management
          goals need.
        title: Target Profile
      cross_sectoral:
        text: cross_sectoral
        description: Covers risks of models or applications used across use cases
          or sectors, or activities common to them, such as using large language models.
        title: Cross-sectoral profile
  GaiRiskName:
    name: GaiRiskName
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskName
    description: The 12 risks of section 2.
    comments:
    - The tables of section 3 tag actions with these risks, in slightly different
      spellings from the definitions in section 2. Each alias is a spelling the tables
      use.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      cbrn_information_or_capabilities:
        text: cbrn_information_or_capabilities
        description: Easier access to dangerous information or design abilities for
          chemical, biological, radiological or nuclear weapons.
        title: CBRN Information or Capabilities
        aliases:
        - CBRN Information and Capability
      confabulation:
        text: confabulation
        description: Confident but wrong output that can mislead users.
        title: Confabulation
      dangerous_violent_or_hateful_content:
        text: dangerous_violent_or_hateful_content
        description: Easier production of content that incites or threatens, recommends
          harm, or disparages.
        title: Dangerous, Violent, or Hateful Content
      data_privacy:
        text: data_privacy
        description: Leaks, misuse or de-anonymization of personal or sensitive data.
        title: Data Privacy
      environmental_impacts:
        text: environmental_impacts
        description: Effects on ecosystems from the heavy computing that training
          and operating models need.
        title: Environmental Impacts
        aliases:
        - Environmental
      harmful_bias_or_homogenization:
        text: harmful_bias_or_homogenization
        description: Worse systemic bias, unequal performance across groups or languages,
          and output skewed by sameness.
        title: Harmful Bias or Homogenization
        aliases:
        - Harmful Bias and Homogenization
      human_ai_configuration:
        text: human_ai_configuration
        description: Interaction that leads people to over-rely on, anthropomorphize
          or become entangled with a system, or to distrust it.
        title: Human-AI Configuration
        aliases:
        - Human AI Configuration
      information_integrity:
        text: information_integrity
        description: Easier creation and spread of content that blurs fact and opinion,
          or that can drive large disinformation campaigns.
        title: Information Integrity
      information_security:
        text: information_security
        description: Easier offensive cyber activity, and a larger attack surface
          on a system, its data, code or weights.
        title: Information Security
      intellectual_property:
        text: intellectual_property
        description: Easier unauthorized copying of protected content, exposure of
          trade secrets, and plagiarism.
        title: Intellectual Property
      obscene_degrading_or_abusive_content:
        text: obscene_degrading_or_abusive_content
        description: Easier production of harmful imagery, including synthetic abuse
          material and intimate images without consent.
        title: Obscene, Degrading, and/or Abusive Content
      value_chain_and_component_integration:
        text: value_chain_and_component_integration
        description: Opaque use of third-party components and data, and poor supplier
          vetting, that weaken accountability downstream.
        title: Value Chain and Component Integration
  GaiRiskGrouping:
    name: GaiRiskGrouping
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskGrouping
    description: The three groups into which footnote 5 says an organization could
      sort the risks, as one possible way.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      technical_or_model:
        text: technical_or_model
        description: Risks from malfunction.
        title: Technical / Model risks
      misuse_by_humans:
        text: misuse_by_humans
        description: Risks from malicious use.
        title: Misuse by humans
      ecosystem_or_societal:
        text: ecosystem_or_societal
        description: Systemic risks.
        title: Ecosystem / societal risks
  GaiLifecycleStage:
    name: GaiLifecycleStage
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiLifecycleStage
    description: The lifecycle stages section 2 names for GAI. They differ from the
      seven stages of the AI RMF's Figure 3.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      design:
        text: design
        description: Setting out the system before it is built.
        title: Design
      development:
        text: development
        description: Building and training it.
        title: Development
      deployment:
        text: deployment
        description: Putting it into use.
        title: Deployment
      operation:
        text: operation
        description: Running it.
        title: Operation
      decommissioning:
        text: decommissioning
        description: Retiring it.
        title: Decommissioning
  GaiRiskScope:
    name: GaiRiskScope
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskScope
    description: The levels where section 2 says a risk may exist.
