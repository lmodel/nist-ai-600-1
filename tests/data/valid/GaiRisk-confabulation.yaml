  - APPLICATION_OR_IMPLEMENTATION
risk_sources:
  - DESIGN
  - TRAINING
  - MODEL_OUTPUTS
time_scale:
  - IMMEDIATE
  - PROLONGED
lifecycle_stage:
  - DEVELOPMENT
  - OPERATION
trustworthiness_characteristic:
  - FAIR_WITH_HARMFUL_BIAS_MANAGED
  - SAFE
  - VALID_AND_RELIABLE
  - EXPLAINABLE_AND_INTERPRETABLE
