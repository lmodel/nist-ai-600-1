id: https://w3id.org/lmodel/nist-ai-600-1/instance/minimal
title: NIST AI RMF Generative AI Profile (minimal)
description: |-
  Minimal NIST AI 600-1 GAI Profile instance covering one GAI risk
  (Confabulation), one suggested action (GV-1.1-001), and one
  primary consideration (Governance).

gai_risk_catalog:
  - id: nist_ai_600_1:risk/confabulation
    title: Confabulation
    gai_risk_kind: CONFABULATION
    risk_categorization: TECHNICAL_OR_MODEL_RISKS
    risk_scope:
      - MODEL_OR_SYSTEM
      - APPLICATION_OR_IMPLEMENTATION
    risk_sources:
      - DESIGN
      - TRAINING
      - MODEL_OUTPUTS
    time_scale:
      - IMMEDIATE
    lifecycle_stage:
      - DEVELOPMENT
      - DEPLOYMENT
      - OPERATION
    trustworthiness_characteristic:
      - FAIR_WITH_HARMFUL_BIAS_MANAGED
      - SAFE
      - VALID_AND_RELIABLE
      - EXPLAINABLE_AND_INTERPRETABLE
    description: |-
      The production of confidently stated but erroneous or false
      content (hallucinations / fabrications).

suggested_actions:
  - id: "nist_ai_600_1:GV-1.1-001"
    action_id: GV-1.1-001
    function_prefix: GV
    applies_to_subcategory: GOVERN 1.1
    title: Align GAI development and use with applicable laws and regulations
    description: |-
      Align GAI development and use with applicable laws and
      regulations, including those related to data privacy, copyright
      and intellectual property law.
    gai_risks:
      - DATA_PRIVACY
      - HARMFUL_BIAS_OR_HOMOGENIZATION
      - INTELLECTUAL_PROPERTY
    actor_task:
      - GOVERNANCE_AND_OVERSIGHT

primary_considerations:
  - id: nist_ai_600_1:consideration/governance
    title: Governance
    consideration_kind: GOVERNANCE
    description: |-
      How organisational governance regimes may be re-evaluated and
      adjusted for GAI contexts.
    governance_practices:
      - AUDITING_AND_ASSESSMENT
      - DATA_PROVENANCE
      - IMPACT_ASSESSMENTS
      - INCIDENT_RESPONSE
      - STAKEHOLDER_ENGAGEMENT
      - SYNTHETIC_CONTENT_DETECTION_AND_LABELING
      - WHISTLEBLOWER_PROTECTIONS

structured_feedback_methods:
  - id: nist_ai_600_1:feedback/ai_red_teaming
    title: AI Red-teaming
    feedback_method_kind: AI_RED_TEAMING
    description: |-
      A structured testing exercise used to probe an AI system to
      find flaws and vulnerabilities such as inaccurate, harmful, or
      discriminatory outputs.
